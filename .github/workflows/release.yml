name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate release notes
        run: |
          ./scripts/generate_release_notes.sh > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@69032c45a6f1f0f29ccf0b114b021659ca73a36e # v2.0.5
        with:
          body_path: /tmp/release_notes.md
          files: abis/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
